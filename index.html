<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jurerê 26/27 🇧🇷</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #009c3b, #ffdf00, #002776);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            width: 85%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-align: center;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: -1px;
        }

        h2 {
            font-size: 1rem;
            text-align: center;
            font-weight: 400;
            margin: 0 0 25px 0;
            color: #eee;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* Countdown */
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 5px;
            border-radius: 14px;
            width: 23%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .time-box .number {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .time-box .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }

        /* Speedometer (Manija) */
        .manija-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 10px 20px;
        }
        
        .manija-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .speedometer-wrapper {
            position: relative;
            width: 260px;
            height: 140px;
        }
        
        .gauge-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .needle {
            position: absolute;
            bottom: 10px; 
            left: 127px; /* Centro exacto menos la mitad del ancho de la aguja */
            width: 6px;
            height: 105px;
            background: #fff;
            border-radius: 3px;
            transform-origin: bottom center;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            /* Vibración de aguja al rojo vivo */
            animation: manija-vibrate 0.06s infinite alternate;
        }

        .center-dot {
            position: absolute;
            bottom: -5px; 
            left: 115px; 
            width: 30px;
            height: 30px;
            background: #222;
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        @keyframes manija-vibrate {
            0% { transform: rotate(82deg); }
            25% { transform: rotate(91deg); }
            50% { transform: rotate(85deg); }
            75% { transform: rotate(95deg); }
            100% { transform: rotate(88deg); }
        }

        .speed-text {
            margin-top: 20px;
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
            display: flex;
            align-items: baseline;
            gap: 8px;
            color: #ff5722;
        }
        .speed-unit {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ddd;
        }
        
        .label-text {
            position: absolute;
            font-size: 0.95rem;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .label-0 { bottom: 0px; left: 10px; }
        .label-125 { top: 0px; left: 116px; }
        .label-250 { bottom: 0px; right: 0px; }

    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Jurerê 26/27 🏖️🍹</h1>
        <h2>Tandil ✈️ Brasil • Año Nuevo</h2>
        
        <div class="countdown">
            <div class="time-box"><span class="number" id="days">00</span><span class="label">Días</span></div>
            <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hrs</span></div>
            <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Min</span></div>
            <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seg</span></div>
        </div>
    </div>

    <div class="glass-panel manija-container">
        <div class="manija-title">Nivel de Manija 🚀</div>
        
        <div class="speedometer-wrapper">
            <svg viewBox="0 0 260 140" class="gauge-svg">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#4caf50" />
                        <stop offset="40%" stop-color="#ffeb3b" />
                        <stop offset="100%" stop-color="#ff5722" />
                    </linearGradient>
                </defs>
                <!-- Fondo del arco transparente -->
                <path d="M 30 130 A 100 100 0 0 1 230 130" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20" stroke-linecap="round"/>
                <!-- Arco coloreado (Verde a Rojo) -->
                <path d="M 30 130 A 100 100 0 0 1 230 130" fill="none" stroke="url(#gaugeGrad)" stroke-width="20" stroke-linecap="round" />
            </svg>
            
            <span class="label-text label-0">0</span>
            <span class="label-text label-125">125</span>
            <span class="label-text label-250">250</span>

            <div class="needle"></div>
            <div class="center-dot"></div>
        </div>

        <div class="speed-text">250<span class="speed-unit">MAX</span></div>
    </div>

    <script>
        const targetDate = new Date("2026-12-26T00:00:00").getTime();
        
        function updateApp() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            if (distance < 0) {
                document.querySelector('.countdown').innerHTML = "<h2 style='width:100%; text-align:center; font-size:1.5rem; margin:0;'>¡LLEGÓ EL DÍA! ✈️🇧🇷</h2>";
            } else {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days.toString().padStart(2, '0');
                document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
                document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
                document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
            }
        }

        setInterval(updateApp, 1000);
        updateApp();
    </script>
</body>
</html>
